[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-category-theory"
version = "0.1.0"
description = "Category theory for composing agent behaviors"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Kubo100x"}]
keywords = ["agent", "category-theory", "composition", "monads", "functors"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/Kubo-cmd/agent-category-theory"
Issues = "https://github.com/Kubo-cmd/agent-category-theory/issues"

[tool.setuptools]
py-modules = ["agent_category_theory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
